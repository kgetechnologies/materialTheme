<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Edit Company</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Edit Company</h1>
    <form>
      <div class='mb-3'><label class='form-label'>Company Name</label><input id='name' class='form-control' value='Acme Manufacturing'></div>
      <div class='mb-3'><label class='form-label'>Auth0 Domain</label><input id='auth0Domain' class='form-control' value='acme.auth0.com'></div>
      <div class='mb-3'><label class='form-label'>Auth0 Audience</label><input id='auth0Audience' class='form-control' value='https://api.acme.com'></div>
      <div class='mb-3'><label class='form-label'>Auth0 Client ID</label><input id='auth0ClientId' class='form-control' value='abc123xyz'></div>
      <div class='mb-3'><label class='form-label'>Logo URL</label><input id='logoUrl' class='form-control' value='https://cdn.acme.com/logo.png'></div>
      <div class='mb-3'><label class='form-label'>Contact Email</label><input id='contactEmail' type='email' class='form-control' value='contact@acme.com'></div>
      <div class='mb-3'><label class='form-label'>Contact Phone</label><input id='contactPhone' class='form-control' value='+1-555-0100'></div>
      <div class='mb-3'><label class='form-label'>Address</label><textarea id='address' class='form-control' rows='3'>123 Manufacturing St, Industrial City, ST 12345</textarea></div>
      <div class='mb-3'><label class='form-label'>Plan</label><select id='plan' class='form-select'>
<option>Free</option>
<option selected>Starter</option>
<option>Professional</option>
<option>Enterprise</option>
</select></div>
      <div class='form-check mb-3'><input type='checkbox' class='form-check-input' id='enabled' checked><label class='form-check-label'>Enabled</label></div>
      <button type='button' class='btn btn-primary'>Update Company</button>
      <a href='01_Companies_List.html' class='btn btn-secondary'>Cancel</a>
    </form>
  </div>
</body>
</html>
