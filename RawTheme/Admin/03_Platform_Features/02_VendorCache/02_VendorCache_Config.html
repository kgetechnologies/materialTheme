<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Cache Configuration</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Cache Configuration</h1>
    <div class='mb-3'><label>Company</label><select class='form-select'><option>Acme Manufacturing</option></select></div>
    <form>
      <div class='form-check mb-3'><input type='checkbox' class='form-check-input' checked><label class='form-check-label'>Cache Enabled</label></div>
      <div class='mb-3'><label>Default TTL (seconds)</label><input type='number' class='form-control' value='3600'></div>
      <div class='mb-3'><label>Max Cache Size</label><input type='number' class='form-control' value='1000'></div>
      <div class='mb-3'><label>Eviction Policy</label><select class='form-select'><option>LRU</option><option>LFU</option><option>FIFO</option></select></div>
      <button type='button' class='btn btn-primary'>Update Config</button>
      <button type='button' class='btn btn-danger'>Clear Cache</button>
    </form>
  </div>
</body>
</html>
