<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Cache Statistics</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Cache Statistics</h1>
    <div class='row text-center mb-4'>
      <div class='col-md-3'><div class='card'><div class='card-body'><h3>85%</h3><small>Hit Rate</small></div></div></div>
      <div class='col-md-3'><div class='card'><div class='card-body'><h3>12,450</h3><small>Total Hits</small></div></div></div>
      <div class='col-md-3'><div class='card'><div class='card-body'><h3>2,100</h3><small>Total Misses</small></div></div></div>
      <div class='col-md-3'><div class='card'><div class='card-body'><h3>850</h3><small>Cached Items</small></div></div></div>
    </div>
    <div class='card'><div class='card-body'><h5>Cache Status</h5><p><strong>Enabled:</strong> Yes</p><p><strong>TTL:</strong> 3600s</p><p><strong>Max Size:</strong> 1000</p></div></div>
  </div>
</body>
</html>
