<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Database Configuration</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Database Configuration</h1>
    <div class='mb-3'><label>Company</label><select class='form-select'><option>Acme Manufacturing</option></select></div>
    <div class='card mb-3'>
      <div class='card-header'><h5>Database Actions</h5></div>
      <div class='card-body d-grid gap-2'>
        <button class='btn btn-primary'>Provision Tenant Tables</button>
        <button class='btn btn-info'>Run Migrations</button>
        <button class='btn btn-warning'>Create Backup</button>
        <button class='btn btn-outline-secondary'>View Table Stats</button>
      </div>
    </div>
    <div class='card'>
      <div class='card-header'><h5>Connection Info</h5></div>
      <div class='card-body'>
        <p><strong>Server:</strong> sql-server.database.windows.net</p>
        <p><strong>Database:</strong> ManufacturingCRM</p>
        <p><strong>CompanyPk:</strong> 12345</p>
      </div>
    </div>
  </div>
</body>
</html>
