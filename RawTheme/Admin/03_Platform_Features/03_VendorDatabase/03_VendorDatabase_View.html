<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Database Statistics</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Database Statistics</h1>
    <div class='card mb-3'>
      <div class='card-body'>
        <h5>Acme Manufacturing</h5>
        <p><strong>Total Tables:</strong> 164</p>
        <p><strong>Total Rows:</strong> 45,230</p>
        <p><strong>Database Size:</strong> 250 MB</p>
      </div>
    </div>
    <h3>Table Statistics</h3>
    <table class='table table-sm'>
      <thead><tr><th>Table</th><th>Rows</th><th>Size</th></tr></thead>
      <tbody>
        <tr><td>Products</td><td>450</td><td>2.5 MB</td></tr>
        <tr><td>OrderLines</td><td>1,250</td><td>8.3 MB</td></tr>
        <tr><td>MaterialLots</td><td>3,400</td><td>15.2 MB</td></tr>
        <tr><td>Users</td><td>25</td><td>0.5 MB</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
