<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Feature Flags</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container-fluid'>
    <div class='d-flex justify-content-between mb-3'>
      <h1>Feature Flags</h1>
      <div>
        <button class='btn btn-success' onclick="alert('POST /api/v1/AppOwner/FeatureFlags/seed')">Seed Flags</button>
        <a href='01_FeatureFlags_Create.html' class='btn btn-primary'>+ Create Flag</a>
      </div>
    </div>

    <div class='card mb-3'>
      <div class='card-body'>
        <label>Filter by Company</label>
        <select class='form-select' style='max-width:300px'>
          <option>All Platform Flags</option>
          <option>Acme Manufacturing</option>
          <option>Beta Industries</option>
        </select>
      </div>
    </div>

    <table class='table table-hover'>
      <thead>
        <tr><th>Key</th><th>Description</th><th>Default</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><code>ProductionReporting_Create</code></td>
          <td>Production reporting create</td>
          <td><span class='badge bg-success'>Enabled</span></td>
          <td><a href='01_FeatureFlags_View.html' class='btn btn-sm btn-outline-primary'>View</a></td>
        </tr>
        <tr>
          <td><code>SupportTickets_Create</code></td>
          <td>Support ticket create</td>
          <td><span class='badge bg-success'>Enabled</span></td>
          <td><a href='01_FeatureFlags_View.html' class='btn btn-sm btn-outline-primary'>View</a></td>
        </tr>
        <tr>
          <td><code>Quality_Delete</code></td>
          <td>Quality (defect/wastage) delete</td>
          <td><span class='badge bg-danger'>Disabled</span></td>
          <td><a href='01_FeatureFlags_View.html' class='btn btn-sm btn-outline-primary'>View</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
