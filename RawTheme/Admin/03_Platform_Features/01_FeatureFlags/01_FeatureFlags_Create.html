<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create Feature Flag</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Create Feature Flag</h1>
    <form>
      <div class='mb-3'><label>Key *</label><input id='key' class='form-control' placeholder='FeatureName_Action' required></div>
      <div class='mb-3'><label>Description</label><input id='description' class='form-control'></div>
      <div class='form-check mb-3'><input id='enabled' type='checkbox' class='form-check-input' checked><label class='form-check-label'>Enabled by Default</label></div>
      <button type='button' class='btn btn-primary' onclick="alert(JSON.stringify({key:document.getElementById('key').value,description:document.getElementById('description').value,enabledByDefault:document.getElementById('enabled').checked},null,2))">Create</button>
    </form>
  </div>
</body>
</html>
