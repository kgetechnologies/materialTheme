<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Defect Analytics</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container-fluid'>
    <h1>Cross-Tenant Defect Analytics</h1>
    <div class='row mb-4'>
      <div class='col-md-3'><div class='card text-center'><div class='card-body'><h3>2,450</h3><small>Total Defects</small></div></div></div>
      <div class='col-md-3'><div class='card text-center'><div class='card-body'><h3>3.2%</h3><small>Avg Defect Rate</small></div></div></div>
      <div class='col-md-3'><div class='card text-center'><div class='card-body'><h3>$125K</h3><small>Est. Cost Impact</small></div></div></div>
      <div class='col-md-3'><div class='card text-center'><div class='card-body'><h3>85%</h3><small>Resolution Rate</small></div></div></div>
    </div>
    <div class='card mb-3'><div class='card-header'><h5>Top Defect Types</h5></div><div class='card-body'><table class='table'><thead><tr><th>Type</th><th>Count</th><th>%</th></tr></thead><tbody><tr><td>Dimensional</td><td>850</td><td>34.7%</td></tr><tr><td>Surface</td><td>620</td><td>25.3%</td></tr><tr><td>Functional</td><td>480</td><td>19.6%</td></tr></tbody></table></div></div>
    <div class='card'><div class='card-header'><h5>Company Comparison</h5></div><div class='card-body'><table class='table'><thead><tr><th>Company</th><th>Defects</th><th>Rate</th></tr></thead><tbody><tr><td>Acme Manufacturing</td><td>450</td><td>2.8%</td></tr><tr><td>Beta Industries</td><td>680</td><td>4.1%</td></tr></tbody></table></div></div>
  </div>
</body>
</html>
