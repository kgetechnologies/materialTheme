<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Edit User</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Edit User</h1>
    <form>
      <div class='mb-3'><label class='form-label'>Email</label><input id='email' type='email' class='form-control' value='john.doe@acme.com'></div>
      <div class='mb-3'><label class='form-label'>Name</label><input id='name' class='form-control' value='John Doe'></div>
      <div class='mb-3'><label class='form-label'>Auth0 Sub</label><input id='auth0Sub' class='form-control' value='auth0|123456789' readonly></div>
      <div class='mb-3'><label class='form-label'>Status</label><select id='status' class='form-select'>
<option selected>Active</option>
<option>Inactive</option>
<option>Blocked</option>
<option>Deleted</option>
</select></div>
      <div class='mb-3'><label class='form-label'>Roles</label><select id='roles' class='form-select' multiple size='4'>
<option selected>Company_Admin</option>
<option selected>Manager</option>
<option>Operator</option>
<option>Viewer</option>
</select><small class='text-muted'>Hold Ctrl/Cmd to select multiple</small></div>
      <button type='button' class='btn btn-primary'>Update User</button>
      <a href='01_Users_List.html' class='btn btn-secondary'>Cancel</a>
    </form>
  </div>
</body>
</html>
