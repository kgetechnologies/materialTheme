<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Users - List</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container-fluid'>
    <h1>Platform Users</h1>
    <div class='card mb-3'>
      <div class='card-body'>
        <div class='row'>
          <div class='col-md-3'>
            <label>Status</label>
            <select class='form-select'>
              <option value=''>All</option>
              <option value='1'>Active</option>
              <option value='2'>Inactive</option>
              <option value='3'>Blocked</option>
            </select>
          </div>
          <div class='col-md-3 d-flex align-items-end'>
            <button class='btn btn-primary'>Search</button>
          </div>
        </div>
      </div>
    </div>
    <table class='table'>
      <thead>
        <tr><th>Email</th><th>Name</th><th>Company</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>admin@acme.com</td>
          <td>John Admin</td>
          <td>Acme Manufacturing</td>
          <td><span class='badge bg-success'>Active</span></td>
          <td><a href='01_Users_View.html' class='btn btn-sm btn-outline-primary'>View</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
