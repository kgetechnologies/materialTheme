<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create User</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class='container'>
    <h1>Create User</h1>
    <form>
      <div class='mb-3'><label>Company</label><select class='form-select' required><option>Select Company</option><option>Acme Manufacturing</option></select></div>
      <div class='mb-3'><label>Email *</label><input type='email' class='form-control' required></div>
      <div class='mb-3'><label>Name</label><input class='form-control'></div>
      <div class='mb-3'><label>Auth0 Sub</label><input class='form-control'></div>
      <div class='form-check mb-3'><input type='checkbox' class='form-check-input' checked><label class='form-check-label'>Active</label></div>
      <button type='button' class='btn btn-primary'>Create User</button>
    </form>
  </div>
</body>
</html>
