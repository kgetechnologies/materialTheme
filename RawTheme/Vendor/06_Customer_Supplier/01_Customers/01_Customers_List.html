<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col"><h2><i class="bi bi-people"></i> Customers</h2></div>
            <div class="col-auto"><button class="btn btn-primary" onclick="location.href='01_Customers_Create.html'"><i class="bi bi-plus-circle"></i> Add Customer</button></div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4"><input type="text" class="form-control" placeholder="Search name, email, phone..."></div>
                    <div class="col-md-3"><select class="form-select"><option>All Types</option><option>Retail</option><option>Wholesale</option></select></div>
                    <div class="col-md-2"><button class="btn btn-secondary w-100"><i class="bi bi-search"></i> Search</button></div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Contact</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr><td><strong>CUST-001</strong></td><td>ABC Corporation</td><td>Wholesale</td><td>John Doe</td><td>john@abc.com</td><td>+1234567890</td><td><span class="badge bg-success">Active</span></td><td><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
