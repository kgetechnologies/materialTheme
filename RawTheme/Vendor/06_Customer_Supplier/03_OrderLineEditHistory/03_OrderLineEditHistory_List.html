<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Line Edit History - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav aria-label="breadcrumb" class="bg-white border-bottom p-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Customer & Supplier</a></li>
            <li class="breadcrumb-item active">Order Line Edit History</li>
        </ol>
    </nav>

    <div class="container-fluid p-4">
        <h2 class="mb-4"><i class="bi bi-clock-history"></i> Order Line Edit History</h2>

        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Search order number...">
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date/Time</th>
                                <th>Order Number</th>
                                <th>Field Changed</th>
                                <th>Old Value</th>
                                <th>New Value</th>
                                <th>Changed By</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>2026-02-11 10:30 AM</td>
                                <td><strong>ORD-2026-0045</strong></td>
                                <td>Quantity</td>
                                <td>100</td>
                                <td>150</td>
                                <td>John Smith</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>2026-02-10 02:15 PM</td>
                                <td><strong>ORD-2026-0044</strong></td>
                                <td>Due Date</td>
                                <td>2026-02-20</td>
                                <td>2026-02-25</td>
                                <td>Jane Doe</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
