<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assign Editor to Order Line Edit History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class="container">
    <h1>Assign Editor to Order Line Edit History</h1>
    <form id="form">
      <div class="mb-3"><label class="form-label">Order Line</label><select id="orderLineId" class="form-select"><option value="1">OL-1001</option></select></div>
      <div class="mb-3"><label class="form-label">Editor</label><select id="editorId" class="form-select"><option value="2">Jane Doe</option></select></div>
      <button id="preview" type="button" class="btn btn-outline-secondary">Preview</button>
      <button id="submit" type="button" class="btn btn-primary">Assign</button>
    </form>
    <pre id="previewJson" style="background:#f8f9fa;padding:12px;margin-top:12px;border-radius:6px"></pre>
  </div>
  <script>
    document.getElementById('preview').addEventListener('click', ()=>{
      const obj = {
        orderLineId: document.getElementById('orderLineId').value ? parseInt(document.getElementById('orderLineId').value) : null,
        editorId: document.getElementById('editorId').value ? parseInt(document.getElementById('editorId').value) : null
      };
      document.getElementById('previewJson').textContent = JSON.stringify(obj,null,2);
    });
    document.getElementById('submit').addEventListener('click', ()=>{ document.getElementById('preview').click(); alert('Mockup: use API docs to send real request') });
  </script>
</body>
</html>
