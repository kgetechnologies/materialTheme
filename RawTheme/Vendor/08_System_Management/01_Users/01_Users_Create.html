<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create - Users Create</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Users Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='01_Users_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='01_Users_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate><div class='mb-3'><label class='form-label'>e m a i l</label><input id='email' class='form-control' type='email' placeholder='Enter e m a i l'></div>
<div class='mb-3'><label class='form-label'>f i r s t N a m e</label><input id='firstName' class='form-control' type='text' placeholder='Enter f i r s t N a m e'></div>
<div class='mb-3'><label class='form-label'>l a s t N a m e</label><input id='lastName' class='form-control' type='text' placeholder='Enter l a s t N a m e'></div>
<div class='mb-3'><label class='form-label'>r o l e I d</label><input id='roleId' class='form-control' type='number' placeholder='Enter r o l e I d'></div>
<div class='mb-3'><label class='form-label'>d e p a r t m e n t I d</label><input id='departmentId' class='form-control' type='number' placeholder='Enter d e p a r t m e n t I d'></div>
<div class='mb-3'><label class='form-label'>p h o n e</label><input id='phone' class='form-control' type='tel' placeholder='Enter p h o n e'></div>
<div class='form-check form-switch mb-3'><input id='isActive' class='form-check-input' type='checkbox' checked> <label class='form-check-label' for='isActive'>i s A c t i v e</label></div>
<div class='form-check form-switch mb-3'><input id='allowToLogin' class='form-check-input' type='checkbox' checked> <label class='form-check-label' for='allowToLogin'>Allow To Login</label></div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};      obj['email'] = document.getElementById('email') && document.getElementById('email').value ? document.getElementById('email').value : null;\n      obj['firstName'] = document.getElementById('firstName') && document.getElementById('firstName').value ? document.getElementById('firstName').value : null;\n      obj['lastName'] = document.getElementById('lastName') && document.getElementById('lastName').value ? document.getElementById('lastName').value : null;\n      obj['roleId'] = document.getElementById('roleId') && document.getElementById('roleId').value ? document.getElementById('roleId').value : null;\n      obj['departmentId'] = document.getElementById('departmentId') && document.getElementById('departmentId').value ? document.getElementById('departmentId').value : null;\n      obj['phone'] = document.getElementById('phone') && document.getElementById('phone').value ? document.getElementById('phone').value : null;\n      obj['isActive'] = document.getElementById('isActive') ? document.getElementById('isActive').checked : false;\n      obj['allowToLogin'] = document.getElementById('allowToLogin') ? document.getElementById('allowToLogin').checked : true;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
