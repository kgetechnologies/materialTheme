<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Scale Production - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col"><h2><i class="bi bi-cup-hot"></i> Small Scale Production</h2><p class="text-muted">Batch production, recipes, and custom jobs</p></div>
            <div class="col-auto">
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="location.href='04_SmallScale_BatchCreate.html'">Batch</button>
                    <button class="btn btn-success" onclick="location.href='04_SmallScale_RecipeCreate.html'">Recipe</button>
                    <button class="btn btn-info" onclick="location.href='04_SmallScale_CustomJobCreate.html'">Custom Job</button>
                </div>
            </div>
        </div>
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link active" href="#">Batches</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Recipes</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Custom Jobs</a></li>
        </ul>
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead><tr><th>Batch #</th><th>Product</th><th>Date</th><th>Planned</th><th>Actual</th><th>Yield %</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr>
                            <td><strong>BATCH-001</strong></td><td>Coffee Roast - Medium</td><td>2026-02-11</td><td>100 kg</td><td>95 kg</td><td>95%</td>
                            <td><span class="badge bg-success">Completed</span></td>
                            <td><button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
