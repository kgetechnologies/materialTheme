<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Processing - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col"><h2><i class="bi bi-egg-fried"></i> Food Processing</h2><p class="text-muted">HACCP compliance, allergen control, traceability</p></div>
            <div class="col-auto">
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="location.href='05_Food_BatchCreate.html'">Batch</button>
                    <button class="btn btn-warning" onclick="location.href='05_Food_HACCP.html'">HACCP</button>
                    <button class="btn btn-danger" onclick="location.href='05_Food_Allergen.html'">Allergen</button>
                    <button class="btn btn-info" onclick="location.href='05_Food_ColdStorage.html'">Cold Storage</button>
                </div>
            </div>
        </div>
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><a class="nav-link active" href="#">Batches</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Blending</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Grinding</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Packaging</a></li>
        </ul>
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead><tr><th>Batch #</th><th>Lot Code</th><th>Product</th><th>Process</th><th>Raw Weight</th><th>Finished Weight</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr>
                            <td><strong>FP-001</strong></td><td>LOT-2026-001</td><td>Spice Mix</td><td>Blending</td><td>500 kg</td><td>495 kg</td><td>2026-08-11</td>
                            <td><span class="badge bg-success">Completed</span></td>
                            <td><button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
