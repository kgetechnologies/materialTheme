  <script>
    function gather(){
      const obj = {};      obj['productId'] = document.getElementById('productId') && document.getElementById('productId').value ? document.getElementById('productId').value : null;\n      obj['batchNumber'] = document.getElementById('batchNumber') && document.getElementById('batchNumber').value ? document.getElementById('batchNumber').value : null;\n      obj['lotCode'] = document.getElementById('lotCode') && document.getElementById('lotCode').value ? document.getElementById('lotCode').value : null;\n      obj['productionDate'] = document.getElementById('productionDate') && document.getElementById('productionDate').value ? document.getElementById('productionDate').value : null;\n      obj['plannedQuantity'] = document.getElementById('plannedQuantity') && document.getElementById('plannedQuantity').value ? document.getElementById('plannedQuantity').value : null;\n      obj['unit'] = document.getElementById('unit') && document.getElementById('unit').value ? document.getElementById('unit').value : null;\n      obj['processingType'] = document.getElementById('processingType') && document.getElementById('processingType').value ? document.getElementById('processingType').value : null;\n      obj['expiryDate'] = document.getElementById('expiryDate') && document.getElementById('expiryDate').value ? document.getElementById('expiryDate').value : null;\n      obj['operatorName'] = document.getElementById('operatorName') && document.getElementById('operatorName').value ? document.getElementById('operatorName').value : null;\n      obj['notes'] = document.getElementById('notes') && document.getElementById('notes').value ? document.getElementById('notes').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
