  <script>
    function gather(){
      const obj = {};      obj['lineName'] = document.getElementById('lineName') && document.getElementById('lineName').value ? document.getElementById('lineName').value : null;\n      obj['lineCode'] = document.getElementById('lineCode') && document.getElementById('lineCode').value ? document.getElementById('lineCode').value : null;\n      obj['lineType'] = document.getElementById('lineType') && document.getElementById('lineType').value ? document.getElementById('lineType').value : null;\n      obj['location'] = document.getElementById('location') && document.getElementById('location').value ? document.getElementById('location').value : null;\n      obj['theoreticalCapacity'] = document.getElementById('theoreticalCapacity') && document.getElementById('theoreticalCapacity').value ? document.getElementById('theoreticalCapacity').value : null;\n      obj['capacityUnit'] = document.getElementById('capacityUnit') && document.getElementById('capacityUnit').value ? document.getElementById('capacityUnit').value : null;\n      obj['maxLineSpeed'] = document.getElementById('maxLineSpeed') && document.getElementById('maxLineSpeed').value ? document.getElementById('maxLineSpeed').value : null;\n      obj['speedUnit'] = document.getElementById('speedUnit') && document.getElementById('speedUnit').value ? document.getElementById('speedUnit').value : null;\n      obj['estimatedChangeoverMinutes'] = document.getElementById('estimatedChangeoverMinutes') && document.getElementById('estimatedChangeoverMinutes').value ? document.getElementById('estimatedChangeoverMinutes').value : null;\n      obj['description'] = document.getElementById('description') && document.getElementById('description').value ? document.getElementById('description').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
