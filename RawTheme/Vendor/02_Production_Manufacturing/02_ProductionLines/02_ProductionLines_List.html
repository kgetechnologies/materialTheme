<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Lines - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col"><h2><i class="bi bi-speedometer2"></i> Production Lines (OEE Tracking)</h2></div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="location.href='02_ProductionLines_Create.html'">
                    <i class="bi bi-plus-circle"></i> Create Line
                </button>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3"><div class="card bg-success text-white"><div class="card-body"><h6>Running</h6><h3>8</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-warning text-white"><div class="card-body"><h6>Changeover</h6><h3>2</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-danger text-white"><div class="card-body"><h6>Breakdown</h6><h3>1</h3></div></div></div>
            <div class="col-md-3"><div class="card bg-info text-white"><div class="card-body"><h6>Avg OEE</h6><h3>78.5%</h3></div></div></div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr><th>Line Code</th><th>Line Name</th><th>Type</th><th>Status</th><th>OEE</th><th>Availability</th><th>Performance</th><th>Quality</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>LINE-A01</strong></td>
                                <td>Assembly Line A</td>
                                <td>Assembly</td>
                                <td><span class="badge bg-success">Running</span></td>
                                <td><strong>85.2%</strong></td>
                                <td>92%</td>
                                <td>95%</td>
                                <td>98%</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="location.href='02_ProductionLines_Downtime.html'"><i class="bi bi-exclamation-triangle"></i></button>
                                    <button class="btn btn-sm btn-outline-warning" onclick="location.href='02_ProductionLines_Changeover.html'"><i class="bi bi-arrow-repeat"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
