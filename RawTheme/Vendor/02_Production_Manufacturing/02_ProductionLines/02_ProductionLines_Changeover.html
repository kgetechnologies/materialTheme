<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Changeover - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container py-4">
        <h2><i class="bi bi-arrow-repeat"></i> Start Changeover</h2>
        <div class="card mt-4">
            <div class="card-body">
                <form>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Production Line <span class="text-danger">*</span></label><select class="form-select" required><option>LINE-A01</option></select></div>
                        <div class="col-md-6"><label class="form-label">Changeover Start <span class="text-danger">*</span></label><input type="datetime-local" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">From Product</label><select class="form-select"><option>Product A</option></select></div>
                        <div class="col-md-6"><label class="form-label">To Product <span class="text-danger">*</span></label><select class="form-select" required><option>Product B</option></select></div>
                        <div class="col-md-4"><label class="form-label">Changeover Type</label><select class="form-select"><option>Product</option><option>Format</option><option>Material</option></select></div>
                        <div class="col-md-4"><label class="form-label">Requires Cleaning?</label><div class="form-check mt-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Yes</label></div></div>
                        <div class="col-md-4"><label class="form-label">Allergen Changeover?</label><div class="form-check mt-2"><input class="form-check-input" type="checkbox"><label class="form-check-label">Yes</label></div></div>
                    </div>
                    <div class="row mt-4">
                        <div class="col"><button type="button" class="btn btn-secondary" onclick="location.href='02_ProductionLines_List.html'">Cancel</button></div>
                        <div class="col text-end"><button type="submit" class="btn btn-warning">Start Changeover</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
