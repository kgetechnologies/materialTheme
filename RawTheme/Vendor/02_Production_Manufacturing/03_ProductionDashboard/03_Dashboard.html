<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Dashboard - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <h2><i class="bi bi-graph-up"></i> Production Dashboard</h2>
        <div class="row mt-4">
            <div class="col-md-3"><div class="card bg-primary text-white"><div class="card-body"><h6>Active Jobs</h6><h2>24</h2></div></div></div>
            <div class="col-md-3"><div class="card bg-success text-white"><div class="card-body"><h6>Completed Today</h6><h2>8</h2></div></div></div>
            <div class="col-md-3"><div class="card bg-warning text-white"><div class="card-body"><h6>Avg OEE</h6><h2>78.5%</h2></div></div></div>
            <div class="col-md-3"><div class="card bg-info text-white"><div class="card-body"><h6>On-Time Delivery</h6><h2>92%</h2></div></div></div>
        </div>
        <div class="row mt-4">
            <div class="col-md-6"><div class="card"><div class="card-body"><h5>Production by Line</h5><canvas id="productionChart"></canvas></div></div></div>
            <div class="col-md-6"><div class="card"><div class="card-body"><h5>OEE Trend</h5><canvas id="oeeChart"></canvas></div></div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
