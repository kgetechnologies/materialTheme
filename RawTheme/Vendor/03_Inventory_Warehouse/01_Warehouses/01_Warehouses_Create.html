    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Warehouses Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='01_Warehouses_List.html'>Back to list</a>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};      obj['warehouseCode'] = document.getElementById('warehouseCode') && document.getElementById('warehouseCode').value ? document.getElementById('warehouseCode').value : null;\n      obj['warehouseName'] = document.getElementById('warehouseName') && document.getElementById('warehouseName').value ? document.getElementById('warehouseName').value : null;\n      obj['warehouseType'] = document.getElementById('warehouseType') && document.getElementById('warehouseType').value ? document.getElementById('warehouseType').value : null;\n      obj['location'] = document.getElementById('location') && document.getElementById('location').value ? document.getElementById('location').value : null;\n      obj['capacity'] = document.getElementById('capacity') && document.getElementById('capacity').value ? document.getElementById('capacity').value : null;\n      obj['capacityUnit'] = document.getElementById('capacityUnit') && document.getElementById('capacityUnit').value ? document.getElementById('capacityUnit').value : null;\n      obj['temperatureControlled'] = document.getElementById('temperatureControlled') && document.getElementById('temperatureControlled').value ? document.getElementById('temperatureControlled').value : null;\n      obj['hazmatCertified'] = document.getElementById('hazmatCertified') && document.getElementById('hazmatCertified').value ? document.getElementById('hazmatCertified').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
