<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouses - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col"><h2><i class="bi bi-building"></i> Warehouses</h2></div>
            <div class="col-auto"><button class="btn btn-primary" onclick="location.href='01_Warehouses_Create.html'"><i class="bi bi-plus-circle"></i> Create Warehouse</button></div>
        </div>
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Location</th><th>Capacity</th><th>Utilization</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr>
                            <td><strong>WH-001</strong></td><td>Main Warehouse</td><td>General</td><td>Building 1</td><td>10000 m²</td><td><div class="progress"><div class="progress-bar bg-success" style="width:75%">75%</div></div></td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td><button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
