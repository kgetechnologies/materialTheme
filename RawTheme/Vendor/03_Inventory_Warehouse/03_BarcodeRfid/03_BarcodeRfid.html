<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode/RFID Tracking - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <h2><i class="bi bi-upc-scan"></i> Barcode/RFID Tracking</h2>
        <div class="row mt-4">
            <div class="col-md-6"><div class="card"><div class="card-body"><h5>Generate Barcode</h5><button class="btn btn-primary">Generate</button></div></div></div>
            <div class="col-md-6"><div class="card"><div class="card-body"><h5>Scan Product</h5><input type="text" class="form-control" placeholder="Scan barcode..."><button class="btn btn-success mt-2">Scan</button></div></div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
