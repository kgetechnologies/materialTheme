<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create - Material Rejection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Record Material Rejection</h1>
      <div>
        <a class="btn btn-outline-secondary" href="06_MaterialRejection_List.html">Back to list</a>
        <a class="btn btn-link muted" href="06_MaterialRejection_API.md" target="_blank">API Docs</a>
      </div>
    </div>

    <p class="text-muted">Maps to <code>POST /api/v1/VendorClient/MaterialRejection/{companyId}/create</code>.</p>

    <form id="createForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Rejection Date</label>
        <input id="rejectionDate" class="form-control" type="date" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Material</label>
        <select id="materialPk" class="form-select">
          <option value="">Select material</option>
          <option value="1">Steel Sheet 304</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Supplier</label>
        <select id="supplierPk" class="form-select">
          <option value="">Select supplier</option>
          <option value="5">ABC Steel Co.</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input id="quantity" class="form-control" type="number" step="0.01" value="1">
      </div>

      <div class="mb-3">
        <label class="form-label">Unit</label>
        <input id="unit" class="form-control" type="text" value="kg">
      </div>

      <div class="mb-3">
        <label class="form-label">Reason</label>
        <input id="reason" class="form-control" type="text" placeholder="Surface defects">
      </div>

      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea id="notes" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <button id="submitBtn" class="btn btn-primary" type="button">Record Rejection</button>
        <button id="previewBtn" class="btn btn-outline-secondary ms-2" type="button">Preview Request</button>
      </div>
    </form>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Request Preview</h5>
        <pre id="requestJson" style="white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px"></pre>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      return {
        rejectionDate: document.getElementById('rejectionDate').value || null,
        materialPk: document.getElementById('materialPk').value ? parseInt(document.getElementById('materialPk').value) : null,
        supplierPk: document.getElementById('supplierPk').value ? parseInt(document.getElementById('supplierPk').value) : null,
        quantity: document.getElementById('quantity').value ? parseFloat(document.getElementById('quantity').value) : null,
        unit: document.getElementById('unit').value || null,
        reason: document.getElementById('reason').value || null,
        notes: document.getElementById('notes').value || null
      };
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(), null, 2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(), null, 2);
      alert('Mockup preview - use API docs to send real requests.');
    });
  </script>
</body>
</html>
