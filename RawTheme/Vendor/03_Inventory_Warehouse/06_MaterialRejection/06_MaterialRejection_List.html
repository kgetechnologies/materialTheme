<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Rejection - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav aria-label="breadcrumb" class="bg-white border-bottom p-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Inventory & Warehouse</a></li>
            <li class="breadcrumb-item active">Material Rejection</li>
        </ol>
    </nav>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-x-octagon"></i> Material Rejection Log</h2>
            <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Record Rejection</button>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3">
                    <div class="col-md-3">
                        <input type="date" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="">All Materials</option>
                            <option>Steel Sheet 304</option>
                            <option>Copper Wire</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Material</th>
                                <th>Quantity</th>
                                <th>Reason</th>
                                <th>Supplier</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>2026-02-10</td>
                                <td><strong>Steel Sheet 304</strong></td>
                                <td>25 kg</td>
                                <td>Surface defects</td>
                                <td>ABC Steel Co.</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                    <button class="btn btn-sm btn-outline-warning"><i class="bi bi-arrow-return-left"></i> Return</button>
                                </td>
                            </tr>
                            <tr>
                                <td>2026-02-09</td>
                                <td><strong>Copper Wire 12AWG</strong></td>
                                <td>50 m</td>
                                <td>Wrong specification</td>
                                <td>Wire Supplies Ltd</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                    <button class="btn btn-sm btn-outline-warning"><i class="bi bi-arrow-return-left"></i> Return</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
