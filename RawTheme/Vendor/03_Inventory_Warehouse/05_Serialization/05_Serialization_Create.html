<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create - Serialization Create</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Serialization Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='05_Serialization_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='05_Serialization_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate><div class='mb-3'><label class='form-label'>s e r i a l N u m b e r</label><input id='serialNumber' class='form-control' type='text' placeholder='Enter s e r i a l N u m b e r'></div>
<div class='mb-3'><label class='form-label'>p r o d u c t P k</label><input id='productPk' class='form-control' type='text' placeholder='Enter p r o d u c t P k'></div>
<div class='mb-3'><label class='form-label'>s t a t u s</label><select id='status' class='form-select'>
<option value="Unknown">Unknown</option>
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
<option value="Deleted">Deleted</option>
<option value="Archived">Archived</option>
<option value="Draft">Draft</option>
<option value="Pending">Pending</option>
</select></div>
<div class='mb-3'><label class='form-label'>p a g e N u m b e r</label><input id='pageNumber' class='form-control' type='text' placeholder='Enter p a g e N u m b e r'></div>
<div class='mb-3'><label class='form-label'>p a g e S i z e</label><input id='pageSize' class='form-control' type='text' placeholder='Enter p a g e S i z e'></div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};      obj['serialNumber'] = document.getElementById('serialNumber') && document.getElementById('serialNumber').value ? document.getElementById('serialNumber').value : null;\n      obj['productPk'] = document.getElementById('productPk') && document.getElementById('productPk').value ? document.getElementById('productPk').value : null;\n      obj['status'] = document.getElementById('status') && document.getElementById('status').value ? document.getElementById('status').value : null;\n      obj['pageNumber'] = document.getElementById('pageNumber') && document.getElementById('pageNumber').value ? document.getElementById('pageNumber').value : null;\n      obj['pageSize'] = document.getElementById('pageSize') && document.getElementById('pageSize').value ? document.getElementById('pageSize').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
