<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serialization - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav aria-label="breadcrumb" class="bg-white border-bottom p-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Inventory & Warehouse</a></li>
            <li class="breadcrumb-item active">Serialization</li>
        </ol>
    </nav>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-upc-scan"></i> Serial Number Tracking</h2>
            <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Generate Serial Numbers</button>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Search serial number...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="">All Products</option>
                            <option>Laptop Model X</option>
                            <option>Smartphone Pro</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Serial Number</th>
                                <th>Product</th>
                                <th>Order</th>
                                <th>Production Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>SN-2026-001234</strong></td>
                                <td>Laptop Model X</td>
                                <td>ORD-2026-0045</td>
                                <td>2026-02-10</td>
                                <td><span class="badge bg-success">Shipped</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                    <button class="btn btn-sm btn-outline-info"><i class="bi bi-clock-history"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>SN-2026-001235</strong></td>
                                <td>Smartphone Pro</td>
                                <td>ORD-2026-0046</td>
                                <td>2026-02-11</td>
                                <td><span class="badge bg-warning">In Production</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                    <button class="btn btn-sm btn-outline-info"><i class="bi bi-clock-history"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
