<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create Regional Address</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Regional Address</h1>
      <div>
        <a class='btn btn-outline-secondary' href='08_RegionalAddress_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='08_RegionalAddress_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate>
      <div class='mb-3'>
        <label class='form-label'>Region</label>
        <input id='region' class='form-control' type='text' placeholder='Enter region'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Address Line 1</label>
        <input id='addressLine1' class='form-control' type='text' placeholder='Enter address line 1'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>City</label>
        <input id='city' class='form-control' type='text' placeholder='Enter city'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>State / Province</label>
        <input id='stateProvince' class='form-control' type='text' placeholder='Enter state or province'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Country</label>
        <input id='country' class='form-control' type='text' placeholder='Enter country'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Postal Code</label>
        <input id='postalCode' class='form-control' type='text' placeholder='Enter postal code'>
      </div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {
        region: document.getElementById('region').value || null,
        addressLine1: document.getElementById('addressLine1').value || null,
        city: document.getElementById('city').value || null,
        stateProvince: document.getElementById('stateProvince').value || null,
        country: document.getElementById('country').value || null,
        postalCode: document.getElementById('postalCode').value || null
      };
      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
