<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create - ManufacturingSites Create</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create ManufacturingSites Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='04_ManufacturingSites_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='04_ManufacturingSites_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate>
      <div class='mb-3'><label class='form-label'>siteCode</label><input id='siteCode' class='form-control' type='text' placeholder='Enter siteCode'></div>
      <div class='mb-3'><label class='form-label'>n a m e</label><input id='name' class='form-control' type='text' placeholder='Enter n a m e'></div>
      <div class='mb-3'><label class='form-label'>Location</label><select id='locationPk' class='form-select'></select></div>
      <div class='mb-3'><label class='form-label'>Capacity</label><input id='capacity' type='number' class='form-control' placeholder='Enter capacity'></div>
      <div class='mb-3'><label class='form-label'>Capacity Unit</label><input id='capacityUnit' class='form-control' value='units/day'></div>
      <div class='form-check form-switch mb-3'><input id='isActive' class='form-check-input' type='checkbox' checked><label class='form-check-label' for='isActive'>Active</label></div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};
      obj['siteCode'] = document.getElementById('siteCode') && document.getElementById('siteCode').value ? document.getElementById('siteCode').value : null;
      obj['name'] = document.getElementById('name') && document.getElementById('name').value ? document.getElementById('name').value : null;
      obj['locationPk'] = document.getElementById('locationPk') && document.getElementById('locationPk').value ? parseInt(document.getElementById('locationPk').value) : null;
      obj['capacity'] = document.getElementById('capacity') && document.getElementById('capacity').value ? parseFloat(document.getElementById('capacity').value) : null;
      obj['capacityUnit'] = document.getElementById('capacityUnit') && document.getElementById('capacityUnit').value ? document.getElementById('capacityUnit').value : null;
      obj['isActive'] = document.getElementById('isActive') ? document.getElementById('isActive').checked : null;
      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
