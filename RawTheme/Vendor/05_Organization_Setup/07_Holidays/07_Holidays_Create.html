<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create Holiday</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Holiday</h1>
      <div>
        <a class='btn btn-outline-secondary' href='07_Holidays_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='07_Holidays_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate>
      <div class='mb-3'>
        <label class='form-label'>Holiday Date</label>
        <input id='holidayDate' class='form-control' type='date' placeholder='Select holiday date'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Holiday Name</label>
        <input id='holidayName' class='form-control' type='text' placeholder='Enter holiday name'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Holiday Type</label>
        <input id='holidayType' class='form-control' type='text' placeholder='Enter holiday type (e.g., National)'>
      </div>
      <div class='mb-3'>
        <label class='form-label'>Applicable Locations</label>
        <input id='applicableLocations' class='form-control' type='text' placeholder='Enter applicable locations'>
      </div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {
        holidayDate: document.getElementById('holidayDate').value ? document.getElementById('holidayDate').value : null,
        holidayName: document.getElementById('holidayName').value ? document.getElementById('holidayName').value : null,
        holidayType: document.getElementById('holidayType').value ? document.getElementById('holidayType').value : null,
        applicableLocations: document.getElementById('applicableLocations').value ? document.getElementById('applicableLocations').value : null
      };
      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
