<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create - Shifts Create</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Shifts Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='06_Shifts_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='06_Shifts_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate>
      <div class='mb-3'>
        <label class='form-label'>n a m e</label>
        <input id='name' class='form-control' type='text' placeholder='Enter n a m e'>
      </div>
      <div class="mb-3">
        <label class="form-label">Shift Name</label>
        <input id="shiftName" class="form-control" placeholder="Night Shift">
      </div>
      <div class="mb-3">
        <label class="form-label">Start Time</label>
        <input id="startTime" type="time" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">End Time</label>
        <input id="endTime" type="time" class="form-control">
      </div>
      <div class="form-check form-switch mb-3">
        <input id="isActive" class="form-check-input" type="checkbox" checked>
        <label class="form-check-label" for="isActive">Active</label>
      </div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};
      obj['name'] = document.getElementById('name') && document.getElementById('name').value ? document.getElementById('name').value : null;
      obj['shiftName'] = document.getElementById('shiftName') && document.getElementById('shiftName').value ? document.getElementById('shiftName').value : null;
      obj['startTime'] = document.getElementById('startTime') && document.getElementById('startTime').value ? document.getElementById('startTime').value : null;
      obj['endTime'] = document.getElementById('endTime') && document.getElementById('endTime').value ? document.getElementById('endTime').value : null;
      obj['isActive'] = document.getElementById('isActive') ? document.getElementById('isActive').checked : false;
      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
