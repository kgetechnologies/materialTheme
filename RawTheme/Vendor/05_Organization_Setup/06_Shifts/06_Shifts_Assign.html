<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assign Employee to Shift</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class="container">
    <h1>Assign Employee to Shift</h1>
    <form id="form">
      <div class="mb-3"><label class="form-label">Employee</label><select id="employeeId" class="form-select"><option value="1">John Doe</option></select></div>
      <div class="mb-3"><label class="form-label">Shift</label><select id="shiftId" class="form-select"><option value="1">Morning Shift</option></select></div>
      <div class="mb-3"><label class="form-label">Assignment Date</label><input id="assignmentDate" type="date" class="form-control"></div>
      <div class="mb-3"><label class="form-label">End Date</label><input id="endDate" type="date" class="form-control"></div>
      <button id="preview" type="button" class="btn btn-outline-secondary">Preview</button>
      <button id="submit" type="button" class="btn btn-primary">Assign</button>
    </form>
    <pre id="previewJson" style="background:#f8f9fa;padding:12px;margin-top:12px;border-radius:6px"></pre>
  </div>
  <script>
    document.getElementById('preview').addEventListener('click', ()=>{
      const obj = {
        employeeId: document.getElementById('employeeId').value ? parseInt(document.getElementById('employeeId').value) : null,
        shiftId: document.getElementById('shiftId').value ? parseInt(document.getElementById('shiftId').value) : null,
        assignmentDate: document.getElementById('assignmentDate').value || null,
        endDate: document.getElementById('endDate').value || null
      };
      document.getElementById('previewJson').textContent = JSON.stringify(obj,null,2);
    });
    document.getElementById('submit').addEventListener('click', ()=>{ document.getElementById('preview').click(); alert('Mockup: use API docs to send real request') });
  </script>
</body>
</html>
