<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Location</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class="container">
    <h1>Create Location</h1>
    <form id="form">
      <div class="mb-3"><label class="form-label">Name</label><input id="name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Code</label><input id="code" class="form-control"></div>
      <div class="form-check form-switch mb-3"><input id="isActive" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="isActive">Active</label></div>
      <button id="preview" type="button" class="btn btn-outline-secondary">Preview</button>
      <button id="submit" type="button" class="btn btn-primary">Create</button>
    </form>
    <pre id="previewJson" style="background:#f8f9fa;padding:12px;margin-top:12px;border-radius:6px"></pre>
  </div>
  <script>
    document.getElementById('preview').addEventListener('click', ()=>{
      const obj = {
        name: document.getElementById('name').value || null,
        code: document.getElementById('code').value || null,
        isActive: document.getElementById('isActive').checked
      };
      document.getElementById('previewJson').textContent = JSON.stringify(obj,null,2);
    });
    document.getElementById('submit').addEventListener('click', ()=>{ document.getElementById('preview').click(); alert('Mockup: use API docs to send real request') });
  </script>
</body>
</html>
