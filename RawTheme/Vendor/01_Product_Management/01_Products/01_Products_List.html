<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-box-seam"></i> Products</h2>
                <p class="text-muted">Manage your product catalog</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="location.href='01_Products_Create.html'">
                    <i class="bi bi-plus-circle"></i> Create Product
                </button>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Search</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name or SKU...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="0">Inactive</option>
                            <option value="1">Approved</option>
                            <option value="2">Deleted</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Sort Order</label>
                        <select class="form-select" id="sortOrder">
                            <option value="false">Descending</option>
                            <option value="true">Ascending</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-secondary w-100" onclick="searchProducts()">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>SKU</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Barcode</th>
                                <th>RFID</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Sample Row -->
                            <tr>
                                <td>1001</td>
                                <td><span class="badge bg-secondary">SKU-001</span></td>
                                <td>Sample Product A</td>
                                <td><span class="badge bg-success">Approved</span></td>
                                <td>123456789012</td>
                                <td>RFID-001</td>
                                <td>2026-02-01</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="editProduct(1001)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-success" onclick="approveProduct(1001)">
                                        <i class="bi bi-check-circle"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(1001)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-info" onclick="generateBarcode(1001)">
                                        <i class="bi bi-upc-scan"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1">Previous</a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API Configuration
        const API_BASE = 'https://localhost:7001/api/v1/VendorClient/Products';
        const COMPANY_ID = 'YOUR_COMPANY_GUID';
        const AUTH_TOKEN = 'YOUR_JWT_TOKEN';

        function searchProducts() {
            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            const ascending = document.getElementById('sortOrder').value === 'true';
            
            // Call API - See 01_Products_API.md for details
            console.log('Searching products...', { search, status, ascending });
        }

        function editProduct(id) {
            location.href = `01_Products_Edit.html?id=${id}`;
        }

        function approveProduct(id) {
            if (confirm('Approve this product?')) {
                // Call API - See 01_Products_API.md
                console.log('Approving product:', id);
            }
        }

        function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                // Call API - See 01_Products_API.md
                console.log('Deleting product:', id);
            }
        }

        function generateBarcode(id) {
            // Call API - See 01_Products_API.md
            console.log('Generating barcode for:', id);
        }
    </script>
</body>
</html>
