  <script>
    function gather(){
      const obj = {};      obj['productId'] = document.getElementById('productId') && document.getElementById('productId').value ? document.getElementById('productId').value : null;\n      obj['variantName'] = document.getElementById('variantName') && document.getElementById('variantName').value ? document.getElementById('variantName').value : null;\n      obj['sku'] = document.getElementById('sku') && document.getElementById('sku').value ? document.getElementById('sku').value : null;\n      obj['barcode'] = document.getElementById('barcode') && document.getElementById('barcode').value ? document.getElementById('barcode').value : null;\n      obj['description'] = document.getElementById('description') && document.getElementById('description').value ? document.getElementById('description').value : null;\n      obj['variantAttributes'] = document.getElementById('variantAttributes') && document.getElementById('variantAttributes').value ? document.getElementById('variantAttributes').value : null;\n      obj['basePrice'] = document.getElementById('basePrice') && document.getElementById('basePrice').value ? document.getElementById('basePrice').value : null;\n      obj['wholesalePrice'] = document.getElementById('wholesalePrice') && document.getElementById('wholesalePrice').value ? document.getElementById('wholesalePrice').value : null;\n      obj['retailPrice'] = document.getElementById('retailPrice') && document.getElementById('retailPrice').value ? document.getElementById('retailPrice').value : null;\n      obj['costPrice'] = document.getElementById('costPrice') && document.getElementById('costPrice').value ? document.getElementById('costPrice').value : null;\n      obj['minimumStock'] = document.getElementById('minimumStock') && document.getElementById('minimumStock').value ? document.getElementById('minimumStock').value : null;\n      obj['maximumStock'] = document.getElementById('maximumStock') && document.getElementById('maximumStock').value ? document.getElementById('maximumStock').value : null;\n      obj['reorderPoint'] = document.getElementById('reorderPoint') && document.getElementById('reorderPoint').value ? document.getElementById('reorderPoint').value : null;\n      obj['weight'] = document.getElementById('weight') && document.getElementById('weight').value ? document.getElementById('weight').value : null;\n      obj['weightUnit'] = document.getElementById('weightUnit') && document.getElementById('weightUnit').value ? document.getElementById('weightUnit').value : null;\n      obj['length'] = document.getElementById('length') && document.getElementById('length').value ? document.getElementById('length').value : null;\n      obj['width'] = document.getElementById('width') && document.getElementById('width').value ? document.getElementById('width').value : null;\n      obj['height'] = document.getElementById('height') && document.getElementById('height').value ? document.getElementById('height').value : null;\n      obj['dimensionUnit'] = document.getElementById('dimensionUnit') && document.getElementById('dimensionUnit').value ? document.getElementById('dimensionUnit').value : null;\n      obj['isDefault'] = document.getElementById('isDefault') && document.getElementById('isDefault').value ? document.getElementById('isDefault').value : null;\n      obj['notes'] = document.getElementById('notes') && document.getElementById('notes').value ? document.getElementById('notes').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
