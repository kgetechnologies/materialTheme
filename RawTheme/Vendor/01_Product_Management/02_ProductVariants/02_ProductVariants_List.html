<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Variants - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-grid-3x3"></i> Product Variants</h2>
                <p class="text-muted">Multi-dimensional product variants with SKU management</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="location.href='02_ProductVariants_Create.html'">
                    <i class="bi bi-plus-circle"></i> Create Variant
                </button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchTerm" placeholder="Search SKU or name...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="productFilter">
                            <option value="">All Products</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="1">Active</option>
                            <option value="0">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="lowStockOnly">
                            <label class="form-check-label" for="lowStockOnly">Low Stock Only</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-secondary w-100" onclick="search()">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Variant Name</th>
                                <th>Attributes</th>
                                <th>Base Price</th>
                                <th>Retail Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span class="badge bg-secondary">TSHIRT-RED-L</span></td>
                                <td>Red T-Shirt - Large</td>
                                <td><small>Color: Red, Size: L</small></td>
                                <td>$29.99</td>
                                <td>$39.99</td>
                                <td><span class="badge bg-warning">45/50</span></td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="edit(1)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-info" onclick="viewDetails(1)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <nav><ul class="pagination justify-content-center">
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                </ul></nav>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
