<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Create - Materials Create</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class='container'>
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create Materials Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='03_Materials_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='03_Materials_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class='text-muted'>This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id='createForm' novalidate><div class='mb-3'><label class='form-label'>l o t N u m b e r</label><input id='lotNumber' class='form-control' type='text' placeholder='Enter l o t N u m b e r'></div>
<div class='mb-3'><label class='form-label'>b a t c h N u m b e r</label><input id='batchNumber' class='form-control' type='text' placeholder='Enter b a t c h N u m b e r'></div>
<div class='mb-3'><label class='form-label'>m a t e r i a l T y p e</label><input id='materialType' class='form-control' type='text' placeholder='Enter m a t e r i a l T y p e'></div>
<div class='mb-3'><label class='form-label'>l e n g t h</label><input id='length' class='form-control' type='text' placeholder='Enter l e n g t h'></div>
<div class='mb-3'><label class='form-label'>w i d t h</label><input id='width' class='form-control' type='text' placeholder='Enter w i d t h'></div>
<div class='mb-3'><label class='form-label'>t h i c k n e s s</label><input id='thickness' class='form-control' type='text' placeholder='Enter t h i c k n e s s'></div>
<div class='mb-3'><label class='form-label'>q u a n t i t y</label><input id='quantity' class='form-control' type='text' placeholder='Enter q u a n t i t y'></div>
      <div class='mb-3'>
        <button id='submitBtn' class='btn btn-primary' type='button'>Create</button>
        <button id='previewBtn' class='btn btn-outline-secondary ms-2' type='button'>Preview Request</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {};      obj['lotNumber'] = document.getElementById('lotNumber') && document.getElementById('lotNumber').value ? document.getElementById('lotNumber').value : null;\n      obj['batchNumber'] = document.getElementById('batchNumber') && document.getElementById('batchNumber').value ? document.getElementById('batchNumber').value : null;\n      obj['materialType'] = document.getElementById('materialType') && document.getElementById('materialType').value ? document.getElementById('materialType').value : null;\n      obj['length'] = document.getElementById('length') && document.getElementById('length').value ? document.getElementById('length').value : null;\n      obj['width'] = document.getElementById('width') && document.getElementById('width').value ? document.getElementById('width').value : null;\n      obj['thickness'] = document.getElementById('thickness') && document.getElementById('thickness').value ? document.getElementById('thickness').value : null;\n      obj['quantity'] = document.getElementById('quantity') && document.getElementById('quantity').value ? document.getElementById('quantity').value : null;\n      return obj;
    }

    document.getElementById('previewBtn').addEventListener('click', ()=>{
      const payload = gather();
      document.getElementById('requestJson').textContent = JSON.stringify(payload,null,2);
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
