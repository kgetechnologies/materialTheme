<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-layers"></i> Material Lots</h2>
                <p class="text-muted">Raw material inventory and lot tracking</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="location.href='03_Materials_Create.html'">
                    <i class="bi bi-plus-circle"></i> Add Material Lot
                </button>
                <button class="btn btn-info" onclick="location.href='03_Materials_ABCAnalysis.html'">
                    <i class="bi bi-bar-chart"></i> ABC Analysis
                </button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Lot Number...">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Material Type...">
                    </div>
                    <div class="col-md-2">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="lowStockOnly">
                            <label class="form-check-label" for="lowStockOnly">Low Stock</label>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100"><i class="bi bi-search"></i> Search</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Lot Number</th>
                                <th>Material Type</th>
                                <th>Dimensions (L×W×T)</th>
                                <th>Quantity</th>
                                <th>Available</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>LOT-2026-001</strong></td>
                                <td>Steel Sheet</td>
                                <td>2000×1000×5 mm</td>
                                <td>500 kg</td>
                                <td><span class="badge bg-success">450 kg</span></td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-info"><i class="bi bi-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
