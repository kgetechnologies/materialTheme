<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Analytics KPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif}</style>
</head>
<body>
  <div class="container">
    <h1>Create Analytics KPI</h1>
    <form id="form">
      <div class="mb-3"><label class="form-label">KPI Name</label><input id="name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Value</label><input id="value" type="number" class="form-control" step="0.01"></div>
      <div class="mb-3"><label class="form-label">Unit</label><input id="unit" class="form-control"></div>
      <button id="preview" type="button" class="btn btn-outline-secondary">Preview</button>
      <button id="submit" type="button" class="btn btn-primary">Create</button>
    </form>
    <pre id="previewJson" style="background:#f8f9fa;padding:12px;margin-top:12px;border-radius:6px"></pre>
  </div>
  <script>
    document.getElementById('preview').addEventListener('click', ()=>{
      const obj = {
        name: document.getElementById('name').value || null,
        value: document.getElementById('value').value ? parseFloat(document.getElementById('value').value) : null,
        unit: document.getElementById('unit').value || null
      };
      document.getElementById('previewJson').textContent = JSON.stringify(obj,null,2);
    });
    document.getElementById('submit').addEventListener('click', ()=>{ document.getElementById('preview').click(); alert('Mockup: use API docs to send real request') });
  </script>
</body>
</html>
