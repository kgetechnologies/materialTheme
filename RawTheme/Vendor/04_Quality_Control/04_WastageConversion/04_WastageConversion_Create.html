<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create - Wastage Conversion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class="container">
    <div class='d-flex justify-content-between align-items-center mb-3'>
      <h1>Create WastageConversion Create</h1>
      <div>
        <a class='btn btn-outline-secondary' href='04_WastageConversion_List.html'>Back to list</a>
        <a class='btn btn-link muted' href='04_WastageConversion_API.md' target='_blank'>API Docs</a>
      </div>
    </div>

    <p class="text-muted">This form maps to the API create endpoint. Include tenant header <code>X-Company-Id</code> when applicable.</p>

    <form id="form" novalidate>
      <div class="mb-3"><label class="form-label">Conversion Date</label><input id="conversionDate" type="date" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Source Material</label><select id="sourceMaterialPk" class="form-select"><option value="5">Steel Scrap</option></select></div>
      <div class="mb-3"><label class="form-label">Wastage Quantity</label><input id="wastageQuantity" type="number" class="form-control" step="0.01"></div>
      <div class="mb-3"><label class="form-label">Converted Material</label><select id="convertedMaterialPk" class="form-select"><option value="12">Recycled Steel</option></select></div>
      <div class="mb-3"><label class="form-label">Recovered Quantity</label><input id="recoveredQuantity" type="number" class="form-control" step="0.01"></div>
      <div class="mb-3"><label class="form-label">Notes</label><textarea id="notes" class="form-control"></textarea></div>
      <div class="mb-3">
        <button id="submit" class="btn btn-primary" type="button">Record</button>
      </div>
    </form>

    <div class='row'>
      <div class='col-md-12'>
        <div class='card mb-3'>
          <div class='card-body'>
            <h5 class='card-title'>Request Preview</h5>
            <pre id='requestJson' style='white-space:pre-wrap;word-break:break-all;background:#f8f9fa;padding:12px;border-radius:6px'></pre>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function gather(){
      const obj = {
        conversionDate: document.getElementById('conversionDate').value || null,
        sourceMaterialPk: document.getElementById('sourceMaterialPk').value ? parseInt(document.getElementById('sourceMaterialPk').value) : null,
        wastageQuantity: document.getElementById('wastageQuantity').value ? parseFloat(document.getElementById('wastageQuantity').value) : null,
        convertedMaterialPk: document.getElementById('convertedMaterialPk').value ? parseInt(document.getElementById('convertedMaterialPk').value) : null,
        recoveredQuantity: document.getElementById('recoveredQuantity').value ? parseFloat(document.getElementById('recoveredQuantity').value) : null,
        notes: document.getElementById('notes').value || null
      };
      return obj;
    }

    document.getElementById('submit').addEventListener('click', ()=>{
      document.getElementById('requestJson').textContent = JSON.stringify(gather(),null,2);
      alert('This is a mockup preview. Use the API docs to send real requests.')
    });
  </script>
</body>
</html>
