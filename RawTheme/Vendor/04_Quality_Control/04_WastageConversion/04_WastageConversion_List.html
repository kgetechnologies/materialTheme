<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wastage Conversion - Manufacturing CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav aria-label="breadcrumb" class="bg-white border-bottom p-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Quality Control</a></li>
            <li class="breadcrumb-item active">Wastage Conversion</li>
        </ol>
    </nav>

    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-recycle"></i> Wastage Conversion</h2>
            <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Record Conversion</button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Source Material</th>
                                <th>Wastage Qty</th>
                                <th>Converted To</th>
                                <th>Recovered Qty</th>
                                <th>Recovery %</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>2026-02-10</td>
                                <td><strong>Steel Scrap</strong></td>
                                <td>150 kg</td>
                                <td>Recycled Steel</td>
                                <td>120 kg</td>
                                <td><span class="badge bg-success">80%</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
