<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record Stock Defect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{padding:20px;font-family:Segoe UI,Arial,Helvetica,sans-serif} .muted{color:#6c757d}</style>
</head>
<body>
  <div class="container">
    <h1>Record Stock Defect</h1>
    <form id="form">
      <div class="mb-3"><label class="form-label">Defect Type</label><select id="defectTypePk" class="form-select"><option value="1">Physical Damage</option></select></div>
      <div class="mb-3"><label class="form-label">Material</label><select id="materialPk" class="form-select"><option value="5">Steel Sheet 304</option></select></div>
      <div class="mb-3"><label class="form-label">Quantity</label><input id="quantity" type="number" class="form-control" step="0.01"></div>
      <div class="mb-3"><label class="form-label">Unit</label><input id="unit" class="form-control" value="kg"></div>
      <div class="mb-3"><label class="form-label">Reported Date</label><input id="reportedDate" type="date" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Notes</label><textarea id="notes" class="form-control"></textarea></div>
      <button id="preview" type="button" class="btn btn-outline-secondary">Preview</button>
      <button id="submit" type="button" class="btn btn-primary">Record</button>
    </form>
    <pre id="previewJson" style="background:#f8f9fa;padding:12px;margin-top:12px;border-radius:6px"></pre>
  </div>
  <script>
    document.getElementById('preview').addEventListener('click', ()=>{
      const obj = {
        defectTypePk: document.getElementById('defectTypePk').value ? parseInt(document.getElementById('defectTypePk').value) : null,
        materialPk: document.getElementById('materialPk').value ? parseInt(document.getElementById('materialPk').value) : null,
        quantity: document.getElementById('quantity').value ? parseFloat(document.getElementById('quantity').value) : null,
        unit: document.getElementById('unit').value || null,
        reportedDate: document.getElementById('reportedDate').value || null,
        notes: document.getElementById('notes').value || null
      };
      document.getElementById('previewJson').textContent = JSON.stringify(obj,null,2);
    });
    document.getElementById('submit').addEventListener('click', ()=>{ document.getElementById('preview').click(); alert('Mockup: use API docs to send real request') });
  </script>
</body>
</html>
