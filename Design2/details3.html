<!-- DETAILS 2 : Cyber Soul -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Soul Miniature</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

<div class="details-container">

    <div class="image-section">
        <img src="image3.jpg" alt="">
    </div>

    <div class="content-section">

        <span class="tag">Future Design</span>

        <h1>Neo anime boy Miniature</h1>

        <p class="desc">
            Stylish anime-style inspired miniature featuring vibrant blue hair,oversized hoodie styling and premium handcrafted detailing
        </p>

        <div class="price-box">
            <h2>₹2799</h2>
            <span>Premium Delivery</span>
        </div>

        <div class="info-grid">

            <div class="card">
                <h3>Material</h3>
                <p>Glossy Resin</p>
            </div>

            <div class="card">
                <h3>Height</h3>
                <p>9 Inches</p>
            </div>

            <div class="card">
                <h3>Theme</h3>
                <p>Cyberpunk</p>
            </div>

            <div class="card">
                <h3>Delivery</h3>
                <p>6-8 Days</p>
            </div>

        </div>

        <button>Order Now</button>
        <button>Add to Cart</button>

    </div>

</div>
<script>
    const cursor =
    document.querySelector(".cursor");

    const blur =
    document.querySelector(".cursor-blur");

    document.addEventListener("mousemove",(e)=>{

        cursor.style.left =
        e.clientX + "px";

        cursor.style.top =
        e.clientY + "px";

        blur.style.left =
        e.clientX + "px";

        blur.style.top =
        e.clientY + "px";

    });

</script>
</body>
</html>
