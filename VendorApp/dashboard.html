<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vendor Dashboard</title>

  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f6f9;
      padding: 30px;
      color: #333;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 26px;
    }

    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      color: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .stat-card h2 {
      font-size: 36px;
      font-weight: 700;
    }

    .stat-card p {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    
    .active-orders {
      background: linear-gradient(135deg, #5b6cff, #6a5cff);
    }

    .in-progress {
      background: linear-gradient(135deg, #ff7a7a, #ff5ea3);
    }

    .completed {
      background: linear-gradient(135deg, #00c6ff, #00e6a8);
    }

    .delayed {
      background: linear-gradient(135deg, #4caf50, #2e7d32);
    }

    
    .table-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f1f3f6;
      padding: 12px;
      text-align: left;
      font-size: 13px;
      color: #555;
    }

    td {
      padding: 12px;
      border-top: 1px solid #eee;
      font-size: 14px;
    }

   
    .badge {
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      display: inline-block;
    }

    .pending {
      background: #f44336;
    }

    .progress {
      background: #ff9800;
    }

    .done {
      background: #4caf50;
    }
  </style>
</head>

<body>

  <h1>Vendor Dashboard</h1>

  
  <div class="stats-grid">
    <div class="stat-card active-orders">
      <h2>12</h2>
      <p>Assigned Jobs</p>
    </div>

    <div class="stat-card in-progress">
      <h2>5</h2>
      <p>In Progress</p>
    </div>

    <div class="stat-card completed">
      <h2>7</h2>
      <p>Completed Jobs</p>
    </div>

    <div class="stat-card delayed">
      <h2>3</h2>
      <p>Open Defects</p>
    </div>
  </div>

 
  <div class="table-card">
    <h2 style="margin-bottom:15px;">Recent Jobs</h2>

    <table>
      <thead>
        <tr>
          <th>Job ID</th>
          <th>Job Name</th>
          <th>Status</th>
          <th>Last Updated</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>JOB-101</td>
          <td>Inspection</td>
          <td><span class="badge done">Completed</span></td>
          <td>08 Feb 2026</td>
        </tr>

        <tr>
          <td>JOB-102</td>
          <td>Assembly</td>
          <td><span class="badge progress">In Progress</span></td>
          <td>07 Feb 2026</td>
        </tr>

        <tr>
          <td>JOB-103</td>
          <td>Packaging</td>
          <td><span class="badge pending">Pending</span></td>
          <td>06 Feb 2026</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
