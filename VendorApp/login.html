<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vendor Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS Files -->
  <link rel="stylesheet" href="assets/vendor/css/core.css" />
  <link rel="stylesheet" href="assets/css/iconify-icons.css" />
  <link rel="stylesheet" href="assets/css/demo.css" />
  <link rel="stylesheet" href="assets/css/login.css" />

  <style>
    .error-text {
      color: red;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body class="vertical-layout vertical-menu-modern blank-page">

  <div class="authentication-wrapper authentication-basic px-4">
    <div class="authentication-inner">
     
      <div class="card login-card mb-0">
        <div class="card-body">

          <div class="app-brand justify-content-center mb-3">
            <span class="app-brand-text fw-bold">Vendor App</span>
          </div>

          <h4 class="mb-2 text-center">Welcome Back 👋</h4>
          <p class="mb-3 text-center">Please sign in to your account</p>

          <!-- FORM START -->
          <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
              />
              <div id="emailError" class="error-text">
                Please enter a valid email address.
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
              />
              <div id="passwordError" class="error-text">
                Password must be at least 6 characters.
              </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="mb-3 d-flex justify-content-between">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" />
                <label class="form-check-label">Remember me</label>
              </div>
              <a href="#" id="forgotPassword">Forgot Password?</a>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-primary w-100">
              Sign In
            </button>

          </form>
          <!-- FORM END -->

        </div>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const forgotBtn = document.getElementById("forgotPassword");

    // Email Regex
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      let valid = true;

      // Email Validation
      if (!email.value.match(emailPattern)) {
        emailError.style.display = "block";
        email.classList.add("is-invalid");
        valid = false;
      } else {
        emailError.style.display = "none";
        email.classList.remove("is-invalid");
      }

      // Password Validation
      if (password.value.length < 6) {
        passwordError.style.display = "block";
        password.classList.add("is-invalid");
        valid = false;
      } else {
        passwordError.style.display = "none";
        password.classList.remove("is-invalid");
      }

      // If Valid
      if (valid) {
        alert("Login Successful ✅");
        form.reset();

        // Example redirect (optional)
        // window.location.href = "dashboard.html";
      }
    });

    // Remove error while typing
    email.addEventListener("input", () => {
      emailError.style.display = "none";
      email.classList.remove("is-invalid");
    });

    password.addEventListener("input", () => {
      passwordError.style.display = "none";
      password.classList.remove("is-invalid");
    });

    // Forgot Password
    forgotBtn.addEventListener("click", function (e) {
      e.preventDefault();

      const userEmail = prompt("Enter your registered email:");

      if (userEmail) {
        if (emailPattern.test(userEmail)) {
          alert("Password reset link sent to " + userEmail + " 📩");
        } else {
          alert("Please enter a valid email address.");
        }
      }
    });
  </script>

</body>
</html>
